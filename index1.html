<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: rgb(202, 216, 216);
        }

        .qr-box {
            background-color: aliceblue;
            width: 18%;
            margin: auto;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ffffff;
        }

        img {
            width: 95%;
            border-radius: 5%;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        p {
            font-family: Arial, Helvetica, sans-serif;
            color: #666;
            font-size: 13px;
            text-align: center;
        }

        h4 {
            font-family: Arial, Helvetica, sans-serif;
            color: #000000;
            font-size: 17px;
            text-align: center;
        }

        .card-box {
            padding-top: 30px;


        }
 

  

   
    
    </style>
    <title>Document</title>
</head>

<body>
    <div class="card-box">
        <div class="qr-box">
            <img src="qr-code-component-main/images/image-qr-code.png" alt="this is img">
            <h4>Improve your front-end skills by building projects</h4>
            <p>Scan The QR Code To visit Frontend Mentor and take Your coding skills to the next level </p>
        </div>
    </div>
</body>

</html>
